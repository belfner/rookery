[project]
name = "roost"
version = "0.5.0"
description = "Roost - package manager for third-party development tools"
readme = "README.md"
authors = [
    { name = "belfner", email = "belfner@belfner.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.20.0",
    "rich>=13.0.0",
    "niquests>=3.18.4",
]

[project.urls]
Homepage = "https://github.com/belfner/roost"
Repository = "https://github.com/belfner/roost"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.3",
    "twine>=6.2.0",
    "ty>=0.0.1a25",
]

[project.scripts]
roost = "roost.__main__:app"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "SIM118", # Use `key in dict` instead of `key in dict.keys()`
    "RET505", # Superfluous else after return
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Allow assert in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
